[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasentinel"
version = "0.1.0"
description = "Explainable spatio-temporal leak detection for water networks"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
