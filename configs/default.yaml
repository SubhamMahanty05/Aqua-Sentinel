seed: 42
network_name: Net3
network_inp: data/networks/Net3.inp
duration_hours: 24
hydraulic_timestep_min: 15
report_timestep_min: 15
n_pressure_sensors: 16
n_flow_sensors: 8
window_size: 12
n_normal_days: 2
leak_areas_m2: [0.00005, 0.00015]
leak_start_hours: [6, 10]
n_leak_junctions: 8
n_fault_scenarios: 3
fault_noise_std: 0.35
models:
  lstm_hidden: 64
  lstm_layers: 1
  lstm_epochs: 25
  lstm_batch: 32
  lstm_lr: 0.001
  gnn_hidden: 32
  gnn_epochs: 20
  gnn_batch: 16
  gnn_lr: 0.002
  enable_gnn: true
paths:
  processed_dir: data/processed
  model_dir: artifacts/models
  metrics_dir: artifacts/metrics
